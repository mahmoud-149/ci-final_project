name: Ci
on:
  push:
    branches:
      - main
      - dev
jobs:
  lint:
    
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Load cached dependencies
        uses: ./.github/actions/cached-deps  
      # Step 4: Run ESLint
      - name: Run Linter
        run: npm run lint
  test:
    
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Load cached dependencies
        uses: ./.github/actions/cached-deps
      - name: Run Tests
        run: npm run test 
  build:
    needs: [lint,test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Load cached dependencies
        uses: ./.github/actions/cached-deps
      - name: Build project
        run: npm run build  
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: deploy
        run:  echo "deploying"